[project]
name = "cortex"
version = "0.1.0"
description = "Local MCP server giving Claude Code, Claude Desktop, and Cursor shared memory of Fabian's projects, decisions, and machine setup"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
cortex = "cortex.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]
